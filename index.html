<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Omikro - ein minimalistisches Open-Source-DIY-Gadget."
    >
    <title>Omikro</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas
      id="pond"
      data-pond-mode="background"
      aria-label="Interaktiver Hintergrund: Zeigerbewegungen zeichnen Stroemungen."
    >
      Dein Browser kann das Canvas-Element nicht darstellen.
    </canvas>

    <main class="screen">
      <h1 class="wordmark" aria-label="Omikro">
        <span class="wordmark-text" aria-hidden="true" data-wordmark="Omikro">Omikro</span>
      </h1>
    </main>

    <script src="pond.js?v=2"></script>
    <script src="script.js"></script>
  </body>
</html>
